const $ = id => document.getElementById(id);
const board=$('board'), overlay=$('win-overlay'), words=$('show-words'), voice=$('voice');
let totalPairs=6, cards=[], selected=[], matches=0, tries=0, locked=false;
let pending=null, clock=null, startedAt=null, elapsed=0, prevLayout='';
function shuffle(a){let b=a.slice();for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function label(c){return c.label;}
function face(c){return `<span class="face back"><span class="number">${c.position+1}</span><span class="back-icon">★</span></span><span class="face front ${c.kind}"><span class="smallnum">${c.position+1}</span><span class="kind-pill">${c.kind==='food'?'FOOD':'SAUCE'}</span><img alt="" draggable="false" src="${PHOTOS[c.label]}"><span class="word">${c.label}</span></span>`;}
function render(){board.classList.toggle('show-words',words.checked);board.innerHTML=cards.map(c=>`<button type="button" class="card" data-i="${c.position}" aria-label="${c.position+1}ばんのカード" aria-pressed="false"><span class="inner">${face(c)}</span></button>`).join('');}
function updateCard(c){const el=board.children[c.position];if(!el)return;el.classList.toggle('open',c.open);el.classList.toggle('matched',c.matched);el.disabled=c.matched;el.setAttribute('aria-pressed',String(c.open||c.matched));el.setAttribute('aria-label',`${c.position+1}ばん、${c.open||c.matched?c.label+' のしゃしん':'うらがえし'}${c.matched?'、ペア':''}`);}
function updateStats(){$('pairs-score').textContent=`${matches} / ${totalPairs}`;$('turn-score').textContent=`${tries} 回`;$('progress').setAttribute('aria-valuemax',totalPairs);$('progress').setAttribute('aria-valuenow',matches);$('progress-fill').style.width=(100*matches/totalPairs)+'%';}
function updateTime(){let sec=Math.floor(elapsed/1000);$('timer').textContent=`${String(Math.floor(sec/60)).padStart(2,'0')}:${String(sec%60).padStart(2,'0')}`;}
function startTimer(){if(startedAt!==null)return;startedAt=Date.now();clock=setInterval(()=>{elapsed=Date.now()-startedAt;updateTime();},450);}
function stopTimer(){if(clock){clearInterval(clock);clock=null;}if(startedAt!==null)elapsed=Date.now()-startedAt;updateTime();}
function say(t){if(!voice.checked||!('speechSynthesis' in window))return;try{window.speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.83;window.speechSynthesis.speak(u);}catch(e){}}
function clearPending(){if(pending!==null){clearTimeout(pending);pending=null;}}
function isPair(a,b){if(a.kind===b.kind)return false;const f=a.kind==='food'?a:b;const s=a.kind==='seasoning'?a:b;return f.partner===s.label;}
function reset(){clearPending();stopTimer();startedAt=null;elapsed=0;updateTime();if('speechSynthesis' in window)window.speechSynthesis.cancel();matches=0;tries=0;selected=[];locked=false;overlay.classList.remove('show');const selectedPairs=PAIRS.slice(0,totalPairs);let entries=selectedPairs.flatMap(({food,seasoning})=>[{kind:'food',label:food,partner:seasoning},{kind:'seasoning',label:seasoning,partner:food}]);let mix=shuffle(entries);for(let k=0;k<12&&mix.map(c=>c.label).join('|')===prevLayout;k++)mix=shuffle(entries);prevLayout=mix.map(c=>c.label).join('|');cards=mix.map((c,position)=>({...c,position,open:false,matched:false}));$('answer-hints').textContent=selectedPairs.map(p=>p.food+' ＋ '+p.seasoning).join('　｜　');document.querySelector('.hints').open=false;render();updateStats();$('message').textContent='カードを2まい めくってみよう！';}
function confetti(){const colors=['#ffcd5c','#75c7a7','#f18da8','#6ca6e5'];for(let i=0;i<26;i++){const b=document.createElement('span');b.className='confetti';b.style.left=(Math.random()*100)+'%';b.style.width=(5+Math.random()*7)+'px';b.style.height=(7+Math.random()*7)+'px';b.style.background=colors[i%colors.length];b.style.animationDuration=(2+Math.random()*2)+'s';document.body.appendChild(b);setTimeout(()=>b.remove(),4400);}}
function complete(){$('win-text').textContent=`${totalPairs}ペア、ぜんぶクリア！\n${tries}回でそろえたよ。Great job!`;overlay.classList.add('show');$('again').focus();confetti();}
function flip(c){if(locked||c.open||c.matched||selected.length>1)return;startTimer();c.open=true;selected.push(c);updateCard(c);say(c.label);if(selected.length===1){$('message').textContent='あと1まい めくろう！';return;}locked=true;tries++;updateStats();const [a,b]=selected;if(isPair(a,b)){$('message').textContent='Good job! 食べ物と調味料がそろったよ！';pending=setTimeout(()=>{a.matched=b.matched=true;updateCard(a);updateCard(b);matches++;selected=[];locked=false;updateStats();if(matches===totalPairs){stopTimer();$('message').textContent='Excellent! ぜんぶそろったよ！';pending=setTimeout(complete,450);}else $('message').textContent='つぎのペアをさがそう！';},700);}else{$('message').textContent='Nice try! もういちどさがそう！';pending=setTimeout(()=>{a.open=b.open=false;updateCard(a);updateCard(b);selected=[];locked=false;$('message').textContent='つぎの2まいを めくってみよう！';},1550);}}
board.addEventListener('click',e=>{const button=e.target.closest('button.card');if(button){const c=cards[Number(button.dataset.i)];if(c)flip(c);}});
document.querySelectorAll('[data-pairs]').forEach(btn=>btn.addEventListener('click',()=>{const n=Number(btn.dataset.pairs);if(n===totalPairs)return;totalPairs=n;document.querySelectorAll('[data-pairs]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.pairs)===n)));reset();}));
words.addEventListener('change',()=>board.classList.toggle('show-words',words.checked));
voice.addEventListener('change',()=>{if(!voice.checked&&'speechSynthesis' in window)window.speechSynthesis.cancel();});
$('new-game').addEventListener('click',reset);$('again').addEventListener('click',reset);reset();
})();</script></body></html>
